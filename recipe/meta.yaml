{% set name = "pyjama" %}
{% set version = "1.0.0" %}
{% set sha256 = "32af0201765a28fdc96fec63dd7357156467c00c45dc8d52a529e3e31bc3febb" %}

package:
  name: pyjamalib
  version: {{ version }}

source:
  url: https://github.com/tuliofalmeida/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - matplotlib-base
    - numpy
    - scipy
    - pandas
    - python >={{ python_min }}

test:
  imports:
    - pyjamalib
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/tuliofalmeida/pyjama
  summary: A library for analyze joint angles from IMU data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tuliofalmeida
